name: calendar-tests
on:
  pull_request:
  push:
    branches: ['codex/**']
permissions:
  contents: read
concurrency:
  group: calendar-tests-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Build candidate with live sources
        run: python -m src.pipeline --throttle 0.15 --site-dir site
      - uses: actions/upload-artifact@v5
        with:
          name: calendar-candidate
          path: |
            site/
            outputs/source_status.json
            outputs/candidates.json
